<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="'Room ' + ${room.roomNumber}">Room</title>
    <link rel="stylesheet" th:href="@{/css/pico.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>
    <script th:src="@{/webjars/htmx-ext-sse/dist/sse.js}"></script>
</head>
<body>
<main class="container">
    <nav>
        <ul>
            <li><a href="/">&larr; Back to dashboard</a></li>
        </ul>
    </nav>

    <!--/* The detail block is rebuilt from the strongly consistent read and swapped in after each booking or cancellation. */-->
    <article th:fragment="detail" id="detail">
        <hgroup>
            <h1 th:text="'Room ' + ${room.roomNumber}">Room</h1>
            <p>Active bookings <span th:text="${room.bookingCount}">0</span></p>
        </hgroup>

        <div th:if="${message}" th:classappend="${error} ? 'feedback error' : 'feedback ok'" th:text="${message}"></div>

        <h2>Current bookings</h2>
        <p th:if="${room.bookings.isEmpty()}">No active bookings yet.</p>
        <ul class="enrolled-list" th:unless="${room.bookings.isEmpty()}">
            <li th:each="booking : ${room.bookings}">
                <span th:text="${booking.guestName} + ' (' + ${booking.stay.checkIn} + ' to ' + ${booking.stay.checkOut} + ')'">Guest</span>
                <form th:attr="hx-post=@{/rooms/{id}/cancellations(id=${room.roomId})}" hx-target="#detail" hx-swap="outerHTML">
                    <input type="hidden" name="guestId" th:value="${booking.guestId}"/>
                    <input type="hidden" name="checkIn" th:value="${booking.stay.checkIn}"/>
                    <input type="hidden" name="checkOut" th:value="${booking.stay.checkOut}"/>
                    <button type="submit" class="secondary outline">Cancel</button>
                </form>
            </li>
        </ul>

        <h2>Book this room</h2>
        <form th:attr="hx-post=@{/rooms/{id}/bookings(id=${room.roomId})}" hx-target="#detail" hx-swap="outerHTML">
            <fieldset>
                <label>Guest
                    <select name="guestId" required>
                        <option value="" disabled selected>Pick a guest</option>
                        <option th:each="guest : ${guests}" th:value="${guest.guestId}" th:text="${guest.name}">Name</option>
                    </select>
                </label>
                <div class="grid">
                    <label>Check-in
                        <input type="date" name="checkIn" required/>
                    </label>
                    <label>Check-out
                        <input type="date" name="checkOut" required/>
                    </label>
                </div>
            </fieldset>
            <button type="submit">Book</button>
        </form>
    </article>

    <article hx-ext="sse" th:attr="sse-connect=@{/rooms/{id}/activity(id=${room.roomId})}">
        <header><strong>Live activity</strong></header>
        <ul id="activity" sse-swap="activity" hx-swap="beforeend"></ul>
    </article>
</main>
</body>
</html>
