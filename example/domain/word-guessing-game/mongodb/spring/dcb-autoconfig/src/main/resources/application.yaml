spring:
  application:
    name: word-guessing-game-dcb-autoconfig
  mongodb:
    uri: mongodb://localhost:27017/word-guessing-game-dcb-autoconfig
    representation:
      uuid: standard
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true

server:
  shutdown: graceful

occurrent:
  event-store:
    capabilities:
      - dcb
