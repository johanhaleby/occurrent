---
type: specs.openrewrite.org/v1beta/recipe
name: org.occurrent.MigrateOccurrentRenames_0_33
displayName: Migrate Occurrent renamed types (0.32.0 -> 0.33.0)
description: >-
  Renames five subscription-model interfaces that never extended SubscriptionModel and cannot. They are
  capability interfaces applied to types that are not subscription models, so the old "SubscriptionModel"
  suffix claimed a relationship none of them had. ReplayAwareSubscriptionModel becomes ReplayAwareSubscriptions
  and IntrospectableSubscriptionModel becomes IntrospectableSubscriptions on both the blocking and reactor
  stacks. DelegatingSubscriptionModel becomes SubscriptionModelWrapper, since it names a structural fact about
  the instance rather than a per-subscription capability. Its two methods move with it, getDelegatedSubscriptionModel
  to getWrappedSubscriptionModel and getDelegatedSubscriptionModelRecursively to
  getWrappedSubscriptionModelRecursively, so the interface and its methods share one vocabulary.
recipeList:
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.occurrent.subscription.api.blocking.ReplayAwareSubscriptionModel
      newFullyQualifiedTypeName: org.occurrent.subscription.api.blocking.ReplayAwareSubscriptions
      ignoreDefinition: true
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.occurrent.subscription.api.reactor.ReplayAwareSubscriptionModel
      newFullyQualifiedTypeName: org.occurrent.subscription.api.reactor.ReplayAwareSubscriptions
      ignoreDefinition: true
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.occurrent.subscription.api.blocking.IntrospectableSubscriptionModel
      newFullyQualifiedTypeName: org.occurrent.subscription.api.blocking.IntrospectableSubscriptions
      ignoreDefinition: true
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.occurrent.subscription.api.reactor.IntrospectableSubscriptionModel
      newFullyQualifiedTypeName: org.occurrent.subscription.api.reactor.IntrospectableSubscriptions
      ignoreDefinition: true
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.occurrent.subscription.api.blocking.DelegatingSubscriptionModel
      newFullyQualifiedTypeName: org.occurrent.subscription.api.blocking.SubscriptionModelWrapper
      ignoreDefinition: true
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.occurrent.subscription.api.blocking.SubscriptionModelWrapper getDelegatedSubscriptionModel(..)
      newMethodName: getWrappedSubscriptionModel
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.occurrent.subscription.api.blocking.SubscriptionModelWrapper getDelegatedSubscriptionModelRecursively(..)
      newMethodName: getWrappedSubscriptionModelRecursively
