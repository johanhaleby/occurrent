---
type: specs.openrewrite.org/v1beta/recipe
name: org.occurrent.MigrateOccurrentRenames_0_31
displayName: Migrate Occurrent renamed types (0.30.0 -> 0.31.0)
description: >-
  Applies the mechanical type renames introduced between Occurrent 0.30.0 and 0.31.0: the ResumeBehavior and
  StartupMode enums, formerly nested inside each of the Subscription, StreamSubscription, DcbSubscription, and
  Projection annotations, are now top-level types in org.occurrent.annotation. Subscription.StartPosition and
  DcbSubscription.DcbStartPosition also move to the shared top-level org.occurrent.annotation.StartPosition (the
  constants BEGINNING, NOW, and DEFAULT are unchanged). EventMetadata also moves from
  org.occurrent.dsl.subscription to org.occurrent.cloudevents. The Spring Boot annotation machinery
  (OccurrentProperties, SubscriptionAnnotations, Jackson3CloudEventConverterConfiguration, and the five
  autoconfiguration conditions) also moves from org.occurrent.springboot.mongo.common to
  org.occurrent.springboot.common, as it is no longer MongoDB-specific.
recipeList:
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.occurrent.annotation.Subscription$ResumeBehavior
      newFullyQualifiedTypeName: org.occurrent.annotation.ResumeBehavior
      ignoreDefinition: true
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.occurrent.annotation.StreamSubscription$ResumeBehavior
      newFullyQualifiedTypeName: org.occurrent.annotation.ResumeBehavior
      ignoreDefinition: true
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.occurrent.annotation.DcbSubscription$ResumeBehavior
      newFullyQualifiedTypeName: org.occurrent.annotation.ResumeBehavior
      ignoreDefinition: true
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.occurrent.annotation.Projection$ResumeBehavior
      newFullyQualifiedTypeName: org.occurrent.annotation.ResumeBehavior
      ignoreDefinition: true
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.occurrent.annotation.Subscription$StartupMode
      newFullyQualifiedTypeName: org.occurrent.annotation.StartupMode
      ignoreDefinition: true
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.occurrent.annotation.StreamSubscription$StartupMode
      newFullyQualifiedTypeName: org.occurrent.annotation.StartupMode
      ignoreDefinition: true
  - org.openrewrite.java.ChangeType:
