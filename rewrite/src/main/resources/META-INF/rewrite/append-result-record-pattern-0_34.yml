---
type: specs.openrewrite.org/v1beta/recipe
name: org.occurrent.MigrateAppendResultRecordPattern_0_34
displayName: Add the append id binding to a WriteResult/DcbAppendResult record pattern
description: >-
  WriteResult and DcbAppendResult's canonical constructor grew a fourth component, the append id (ADR 132), so a
  record pattern naming only the original three components stops compiling. Rewrites any three-binding
  deconstruction pattern against either type, in a switch case or an instanceof pattern alike, to a four-binding
  one by appending var appendId. This is unconditional, unlike this module's by-hand-marked recipes, since a
  record pattern's arity is a compiler-enforced fact rather than a judgement call.
recipeList:
  - org.occurrent.rewrite.MigrateAppendResultRecordPattern
