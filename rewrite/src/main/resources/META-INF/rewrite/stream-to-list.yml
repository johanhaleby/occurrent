---
type: specs.openrewrite.org/v1beta/recipe
name: org.occurrent.MigrateStreamToList_0_30
displayName: Migrate the Occurrent write side from Stream to List (0.20.5 -> 0.30.0)
description: >-
  Best-effort migration of the Occurrent write-side change from Stream/Sequence to List (ADR 54). Automates the
  cases that are provably safe: the removed StreamCommandComposition is retyped to ListCommandComposition, and a
  Stream.of(...) / Stream.empty() literal passed as the events argument to EventStore.write(...) is rewritten to
  List.of(...) / Collections.emptyList(). Any other Stream-typed write argument (a variable, a Function/Consumer
  typed with Stream, or a lambda whose body uses Stream operations) is left untouched and flagged with a review
  comment, because rewriting a Stream pipeline into a List one cannot be done safely without reading intent. The
  remaining write-side surface (ApplicationService.execute domain functions, View.evolve*, CloudEventConverter,
  and all Kotlin callers) is manual; see doc/migration/upgrading-to-0.30.0.md.
recipeList:
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.occurrent.application.composition.command.StreamCommandComposition
      newFullyQualifiedTypeName: org.occurrent.application.composition.command.ListCommandComposition
      ignoreDefinition: true
  - org.occurrent.rewrite.MigrateEventStoreWriteStreamToList
