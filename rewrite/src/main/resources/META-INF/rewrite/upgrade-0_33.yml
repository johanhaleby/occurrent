---
type: specs.openrewrite.org/v1beta/recipe
name: org.occurrent.UpgradeToOccurrent_0_33
displayName: Upgrade to Occurrent 0.33.0
description: >-
  Migrates an application from Occurrent 0.32.0 to 0.33.0. CheckpointStorage and its reactor twin gained a
  conditional save and a writeVersion read, for the checkpoint fence in ADR 116. This recipe finds a class
  implementing either interface that is missing the two members and inserts a stub for each, marked with a
  review comment, so the class compiles again. The stub delegates any() to the class's own two-argument
  save, refuses a stronger condition, and answers writeVersion empty, the permanent shape for a store that
  cannot evaluate a condition. Evaluating a condition for real is still a manual pass, see
  doc/migration/upgrading-to-0.33.0.md. Also renames ReplayAwareSubscriptionModel and
  IntrospectableSubscriptionModel to ReplayAwareSubscriptions and IntrospectableSubscriptions on both the
  blocking and reactor stacks, and DelegatingSubscriptionModel to SubscriptionModelWrapper, correcting names
  that claimed a SubscriptionModel relationship none of these capability interfaces ever had. A saga timer's
  name is a TimerName rather than a String (ADR 121), so this recipe also wraps a string handed to the
  SagaTimeout constructor, or to the timer-name argument of SagaEffect's StartTimeout, StartTimeoutAt or
  CancelTimeout, in TimerName.parse, and appends encode() to a timerName() read off any of those four types
  into a declared String, marking the reads it cannot type for a manual pass. A saga also expands a declared
  sealed event type into the concrete types it permits and refuses one whose concrete subtypes cannot be
  found (ADR 124), and that change gets no recipe entry, because telling a refused declaration from a sealed
  one that now works needs the sealed modifier, which the type model behind a class literal does not carry.
  See section 10 of doc/migration/upgrading-to-0.33.0.md for the manual steps.
recipeList:
  - org.occurrent.MigrateCheckpointStorageConditionalWrite_0_33
  - org.occurrent.MigrateOccurrentRenames_0_33
  - org.occurrent.MigrateSagaTimerName_0_33
