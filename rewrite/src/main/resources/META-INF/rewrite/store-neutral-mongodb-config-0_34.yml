type: specs.openrewrite.org/v1beta/recipe
name: org.occurrent.MigrateStoreNeutralMongoConfigKeys_0_34
displayName: Rename the four MongoDB-only configuration keys to their mongodb-qualified names (0.33.0 -> 0.34.0)
description: >-
  occurrent.event-store.collection, occurrent.event-store.time-representation, occurrent.subscription.collection
  and occurrent.subscription.restart-on-change-stream-history-lost never described a store-neutral setting, only
  a MongoDB one, so each moves under a mongodb key on its existing prefix: occurrent.event-store.mongodb.collection,
  occurrent.event-store.mongodb.time-representation, occurrent.subscription.mongodb.collection and
  occurrent.subscription.mongodb.restart-on-change-stream-history-lost. Unlike the subscription.enabled rename in
  0.32.0, no value transformation is involved, so this is a plain key rename in both .properties and .yaml. A file
  that already sets both the deprecated and the mongodb-qualified key keeps only the mongodb-qualified one, on the
  assumption that the key you migrated to is the one you meant.
recipeList:
  - org.occurrent.DropRedundantEventStoreCollection_0_34
  - org.openrewrite.properties.ChangePropertyKey:
      oldPropertyKey: occurrent.event-store.collection
      newPropertyKey: occurrent.event-store.mongodb.collection
  - org.openrewrite.yaml.ChangePropertyKey:
      oldPropertyKey: occurrent.event-store.collection
      newPropertyKey: occurrent.event-store.mongodb.collection
  - org.occurrent.DropRedundantEventStoreTimeRepresentation_0_34
  - org.openrewrite.properties.ChangePropertyKey:
      oldPropertyKey: occurrent.event-store.time-representation
      newPropertyKey: occurrent.event-store.mongodb.time-representation
  - org.openrewrite.yaml.ChangePropertyKey:
      oldPropertyKey: occurrent.event-store.time-representation
      newPropertyKey: occurrent.event-store.mongodb.time-representation
  - org.occurrent.DropRedundantSubscriptionCollection_0_34
  - org.openrewrite.properties.ChangePropertyKey:
      oldPropertyKey: occurrent.subscription.collection
      newPropertyKey: occurrent.subscription.mongodb.collection
  - org.openrewrite.yaml.ChangePropertyKey:
      oldPropertyKey: occurrent.subscription.collection
      newPropertyKey: occurrent.subscription.mongodb.collection
  - org.occurrent.DropRedundantRestartOnChangeStreamHistoryLost_0_34
  - org.openrewrite.properties.ChangePropertyKey:
      oldPropertyKey: occurrent.subscription.restart-on-change-stream-history-lost
      newPropertyKey: occurrent.subscription.mongodb.restart-on-change-stream-history-lost
  - org.openrewrite.yaml.ChangePropertyKey:
      oldPropertyKey: occurrent.subscription.restart-on-change-stream-history-lost
      newPropertyKey: occurrent.subscription.mongodb.restart-on-change-stream-history-lost
