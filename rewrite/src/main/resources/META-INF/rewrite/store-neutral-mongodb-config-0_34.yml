---
type: specs.openrewrite.org/v1beta/recipe
name: org.occurrent.DropRedundantEventStoreCollectionInProperties_0_34
displayName: Drop occurrent.event-store.collection from a .properties file where occurrent.event-store.mongodb.collection is already set
description: >-
  Removes the deprecated occurrent.event-store.collection from a .properties file that already sets
  occurrent.event-store.mongodb.collection. Setting both is allowed while they agree, so such a file is valid
  today, but renaming the deprecated key in it would produce two occurrent.event-store.mongodb.collection
  entries. The precondition is evaluated per file, which a .properties file has no multi-document concept to
  complicate: the whole file is the only scope there is. The .yaml half of this guard is a separate,
  document-scoped recipe below, because a .yaml file does not share that property; see
  org.occurrent.rewrite.DropRedundantEventStoreCollectionInYaml_0_34.
preconditions:
  - org.openrewrite.properties.search.FindProperties:
      propertyKey: occurrent.event-store.mongodb.collection
recipeList:
  - org.openrewrite.properties.DeleteProperty:
      propertyKey: occurrent.event-store.collection
---
type: specs.openrewrite.org/v1beta/recipe
name: org.occurrent.DropRedundantEventStoreCollection_0_34
displayName: Drop occurrent.event-store.collection where occurrent.event-store.mongodb.collection is already set
description: >-
  Composes the .properties and .yaml halves of the guard under a single ID, so a recipe list or a user selecting
  org.occurrent.DropRedundantEventStoreCollection_0_34 directly still gets both halves. See
  org.occurrent.DropRedundantEventStoreCollectionInProperties_0_34 and
  org.occurrent.rewrite.DropRedundantEventStoreCollectionInYaml_0_34 for what each half actually does and why
  they are not one declarative recipe.
recipeList:
  - org.occurrent.DropRedundantEventStoreCollectionInProperties_0_34
  - org.occurrent.rewrite.DropRedundantEventStoreCollectionInYaml_0_34
