---
type: specs.openrewrite.org/v1beta/recipe
name: org.occurrent.MigrateNativeMongoSubscriptionRecordPattern_0_35
displayName: Add the startFailure binding to a NativeMongoSubscription record pattern
description: >-
  NativeMongoSubscription's canonical constructor gained a startFailure component, so a record pattern naming only
  the original two components stops compiling. Rewrites a two-binding pattern by appending var startFailure, in a
  switch case or an instanceof pattern alike. A pattern of any other arity is left alone. This is unconditional,
  since a record pattern's arity is a compiler-enforced fact rather than a judgement call. See
  doc/migration/upgrading-to-0.35.0.md.
recipeList:
  - org.occurrent.rewrite.MigrateNativeMongoSubscriptionRecordPattern
