---
type: specs.openrewrite.org/v1beta/recipe
name: org.occurrent.UpgradeToOccurrent_0_35
displayName: Upgrade to Occurrent 0.35.0
description: >-
  Migrates an application from Occurrent 0.34.0 to 0.35.0. All seven framework annotations in
  org.occurrent.annotation get an Occurrent prefix, so an application that uses @Projection, @Saga, @Snapshot,
  @Subscription, @StreamSubscription, @DcbSubscription or @SynchronousSubscription gets the new name and the new
  import (ADR 127 decision 3). The old annotations are deprecated for removal rather than deleted, so an
  application still compiles and behaves exactly as before until it runs this. The four new subscription
  annotations mark a factory method returning a Subscription or DcbSubscription descriptor instead of a void
  handler method, and they declare no eventTypes and no tags, because the descriptor's handlers say which events
  it wants. This recipe renames the annotations and does not rewrite a handler into a descriptor, so an
  application that renames a subscription annotation without moving its handler stops compiling. See
  doc/migration/upgrading-to-0.35.0.md for the handler move, for the Kotlin sources no Java recipe reaches, and
  for the three handler shapes that have to be moved by hand.
recipeList:
  - org.occurrent.MigrateOccurrentAnnotationRenames_0_35
