---
type: specs.openrewrite.org/v1beta/recipe
name: org.occurrent.MigrateCheckpointStorageConditionalWrite_0_33
displayName: Stub the CheckpointStorage conditional write members (0.32.0 -> 0.33.0)
description: >-
  Finds a class implementing the blocking or reactor CheckpointStorage that is missing the three-argument save
  or writeVersion added for a fenced checkpoint write (ADR 116), and inserts a stub for each missing member,
  marked with a review comment, so the class compiles again. A class with its own two-argument save gets a
  three-argument save that delegates any() to it and refuses a stronger condition. A class with no own
  two-argument save, only the interface default, gets one that always refuses, since delegating there would
  call back into the interface default and recurse. writeVersion always answers empty, the permanent shape for
  a store that cannot evaluate a condition. Evaluating a condition for real is still a manual pass, see
  doc/migration/upgrading-to-0.33.0.md. Java only, a Kotlin implementer needs the manual steps instead.
recipeList:
  - org.occurrent.rewrite.AddCheckpointStorageConditionalWriteStubs
