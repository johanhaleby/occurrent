---
type: specs.openrewrite.org/v1beta/recipe
name: org.occurrent.UpgradeToOccurrent_0_34
displayName: Upgrade to Occurrent 0.34.0
description: >-
  Migrates an application from Occurrent 0.33.0 to 0.34.0. The flow saga's deprecated join and Kotlin's
  expect<T> are removed (ADR 125). This recipe rewrites StepBuilder.join(...) to on(StepCondition.allOf(...),
  ...) wherever the expecting argument is a literal List.of(...)/Arrays.asList(...) of literal
  Expectation.of(...) calls, collapsing a duplicate-typed pair to the higher of their counts the same way join
  did whenever both counts are integer literals. Everything else no longer compiles once join is gone, so the
  compiler finds it, and doc/migration/upgrading-to-0.34.0.md has the by-hand translation, including every
  Kotlin call site. Also renames occurrent.event-store.collection, occurrent.event-store.time-representation,
  occurrent.subscription.collection and occurrent.subscription.restart-on-change-stream-history-lost to a
  mongodb-qualified key on their existing prefix, in both .properties and .yaml, since each never described
  anything but a MongoDB event store or subscription model. See doc/migration/upgrading-to-0.34.0.md for what
  that rename cannot reach, such as an environment variable. Also adds the fourth binding, var appendId, to a
  WriteResult/DcbAppendResult record pattern that still names only the original three components (ADR 132).
  A projection, a subscription, a query, a snapshot view and a saga now all refuse a declared event type whose
  concrete subtypes cannot be found, including a concrete class that is neither final nor sealed, which every
  one of them exempted in 0.33.0. ExecuteFilter's type/includeTypes and DcbCriteriaBuilder's type/types get the
  same refusal for the first time, since neither expanded a declared type at all before this release. None of
  this gets a recipe entry, for the reason the 0.33.0 recipe already gives, that telling a refused declaration
  from a sealed one that now works needs the sealed modifier, which the type model behind a class literal does
  not include, and for a second reason on top of it. A recipe cannot tell whether a class that is not final
  should become final or whether the declaration should list concrete types instead, because a subclass may
  live in a module or a repository the recipe never sees. ExecuteFilter's excludeTypes now widens a declared
  type it cannot fully expand to every concrete subtype a downward walk can find instead of refusing it, which
  needs no recipe either, since there is nothing mechanical to rewrite. It is not a breaking change for the
  same reason section 3 of the migration guide gives, that an exclusion which was already narrow does not
  become narrower. For an interface or an abstract declared type whose hierarchy reopens before anything
  concrete is found, how much it excludes still depends on the configured CloudEventTypeMapper, from the whole
  family under one that maps a hierarchy onto a single CloudEvent type string down to nothing at all under one
  that maps each type to its own class name, exactly as before this release, and section 3 names that shape
  and its fix. See section 3 of doc/migration/upgrading-to-0.34.0.md for the manual steps.
recipeList:
  - org.occurrent.MigrateSagaJoinToStepCondition_0_34
  - org.occurrent.MigrateStoreNeutralMongoConfigKeys_0_34
  - org.occurrent.MigrateAppendResultRecordPattern_0_34
