type: specs.openrewrite.org/v1beta/recipe
name: org.occurrent.MigrateSagaTimerName_0_33
displayName: Migrate a saga timer's name to TimerName (0.32.0 -> 0.33.0)
description: >-
  Migrates the saga DSL change that gives a timer's name its own type, TimerName, instead of a String
  (ADR 121). Rewrites what it can prove: new SagaTimeout(sagaId, name) with a String second argument becomes
  new SagaTimeout(sagaId, TimerName.parse(name)), which is the value that string already named, and a
  timerName() read into a declared String gains encode(). Any other read of timerName() gets a review comment
  instead, since the recipe cannot see what the surrounding code wants the name for, and deconstructing a
  SagaEffect timer record against a String component is left for a human, because a record pattern's binding
  type is a judgement about the code that follows it. See doc/migration/upgrading-to-0.33.0.md. Java only, a
  Kotlin caller needs the manual steps instead.
recipeList:
  - org.occurrent.rewrite.MigrateSagaTimerName
