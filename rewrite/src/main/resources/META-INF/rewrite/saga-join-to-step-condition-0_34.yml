---
type: specs.openrewrite.org/v1beta/recipe
name: org.occurrent.MigrateSagaJoinToStepCondition_0_34
displayName: Migrate a flow saga's join to on(StepCondition.allOf(...))
description: >-
  Rewrites StepBuilder.join(List, Continuation[, Function]) to on(StepCondition.allOf(...), Continuation[,
  Function]) wherever the expecting argument is a literal List.of(...)/Arrays.asList(...) of literal
  Expectation.of(...) calls, collapsing a duplicate-typed pair to the higher of their counts the same way join
  did whenever both counts are integer literals. Everything else, including every Kotlin call site, is left for
  doc/migration/upgrading-to-0.34.0.md.
recipeList:
  - org.occurrent.rewrite.MigrateSagaJoinToStepCondition
