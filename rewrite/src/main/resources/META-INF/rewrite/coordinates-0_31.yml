---
type: specs.openrewrite.org/v1beta/recipe
name: org.occurrent.MigrateCoordinates_0_31
displayName: Migrate Occurrent Maven and Gradle artifact coordinates (0.30.0 -> 0.31.0)
description: >-
  Renames the four subscription checkpoint-storage artifacts from their -position-storage coordinates to
  -checkpoint-storage under the unchanged org.occurrent groupId, so the module coordinate matches the
  CheckpointStorage type it ships (the type family was renamed from SubscriptionPosition to Checkpoint in
  0.30.0, see ADR 46, but the module coordinates were not). Covers Maven and Gradle build files.
recipeList:
  - org.openrewrite.maven.ChangeDependencyGroupIdAndArtifactId:
      oldGroupId: org.occurrent
      oldArtifactId: occurrent-subscription-mongodb-native-blocking-position-storage
      newGroupId: org.occurrent
      newArtifactId: occurrent-subscription-mongodb-native-blocking-checkpoint-storage
  - org.openrewrite.maven.ChangeDependencyGroupIdAndArtifactId:
      oldGroupId: org.occurrent
      oldArtifactId: occurrent-subscription-mongodb-spring-blocking-position-storage
      newGroupId: org.occurrent
      newArtifactId: occurrent-subscription-mongodb-spring-blocking-checkpoint-storage
  - org.openrewrite.maven.ChangeDependencyGroupIdAndArtifactId:
      oldGroupId: org.occurrent
      oldArtifactId: occurrent-subscription-mongodb-spring-reactor-position-storage
      newGroupId: org.occurrent
      newArtifactId: occurrent-subscription-mongodb-spring-reactor-checkpoint-storage
  - org.openrewrite.maven.ChangeDependencyGroupIdAndArtifactId:
      oldGroupId: org.occurrent
      oldArtifactId: occurrent-subscription-redis-spring-blocking-position-storage
      newGroupId: org.occurrent
      newArtifactId: occurrent-subscription-redis-spring-blocking-checkpoint-storage
  - org.openrewrite.gradle.ChangeDependency:
      oldGroupId: org.occurrent
      oldArtifactId: occurrent-subscription-mongodb-native-blocking-position-storage
      newGroupId: org.occurrent
      newArtifactId: occurrent-subscription-mongodb-native-blocking-checkpoint-storage
  - org.openrewrite.gradle.ChangeDependency:
      oldGroupId: org.occurrent
      oldArtifactId: occurrent-subscription-mongodb-spring-blocking-position-storage
      newGroupId: org.occurrent
      newArtifactId: occurrent-subscription-mongodb-spring-blocking-checkpoint-storage
  - org.openrewrite.gradle.ChangeDependency:
      oldGroupId: org.occurrent
      oldArtifactId: occurrent-subscription-mongodb-spring-reactor-position-storage
      newGroupId: org.occurrent
      newArtifactId: occurrent-subscription-mongodb-spring-reactor-checkpoint-storage
  - org.openrewrite.gradle.ChangeDependency:
      oldGroupId: org.occurrent
      oldArtifactId: occurrent-subscription-redis-spring-blocking-position-storage
      newGroupId: org.occurrent
      newArtifactId: occurrent-subscription-redis-spring-blocking-checkpoint-storage
