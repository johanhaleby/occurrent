      premise_check:
        note: 'TWO REAL DEFECTS in ADR 134''s premises, plus one gap, found before the design gate reached
          Johan. (1) FALSE: ''every blocking subscription model wraps the handler in executeWithRetry''.
          Only NativeMongoSubscriptionModel, SpringMongoSubscriptionModel and InMemorySubscriptionModel
          do, and InMemory defaults to fixed(200) not exponential. PushSubscriptionModel explicitly propagates
          a handler exception with no retry at all, and DurableSubscriptionModel, the catchup models and
          CompetingConsumerSubscriptionModel have none either. This is load-bearing: the design''s central
          mechanism measures how long a failure has persisted ACROSS RETRIES, and on a transport that
          never retries there is no second attempt for that clock to tick across, yet section 6 reasons
          specifically about push-fed sagas with catchup = NONE. Follow-up dispatched to establish what
          actually happens on those transports today. (2) WRONG IN DETAIL: SagaEnvelope has 11 components,
          not the 6 the ADR enumerates; it omits sagaId, createdAt, updatedAt, completedAt and currentStep.
          Section 2''s ownership argument is built on that enumeration, and currentStep in particular
          is a denormalised observation field, which is arguably a counter-example to the ''everything
          here is delivery bookkeeping or state'' reading. (3) GAP CONFIRMED: no default value is stated
          for the quarantine time budget; five minutes appears only as an illustration. USEFUL FOR THE
