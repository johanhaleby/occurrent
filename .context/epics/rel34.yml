  all_five_workers_had_stopped:
    note: 'MAJOR PROCESS FINDING. A check prompted by sdi''s advice to prefer a mechanism over a memory
      turned up that ALL FIVE held-PR worker sessions were isRunning:false, last active between 12:07
      and 14:57. Every hold I posted went onto a PR comment AFTER its worker had already stopped, so none
      of them had been read and no work was in progress on any of the five. I had been reading ''no push''
      as ''working'' when it meant ''ended''. The durable trace existed and had no reader, which is the
      finding-routing protocol''s own failure mode one layer up: a PR comment cannot forget, and it also
      cannot act. All five woken by message with their specific outstanding work: U2 on 901 (coverage
      test plus #927 plus #907), U4 on 914 (three grouped defects, one only in the suppressed block),
      U6 on 933 (the no-regression floor), U10 on 919 (the non-terminating classifier), U16 on 928 (the
      javadoc overclaim and the Kotlin enum advice). The mechanism this argues for is checking session
      liveness whenever a unit is held on a worker, rather than inferring activity from the absence of
      a push.'
    at: '2026-08-22T16:23:11+00:00'
