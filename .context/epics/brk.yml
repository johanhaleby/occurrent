    next_action: "none; DONE and merged. Thirteen review rounds, and the findings were overwhelmingly real rather than churn: the goLive silent-loss window, the buffered-DELIVERED ack, the typed-extension FILTERED-then-ack loss, sixteen vacuous ack assertions, double serialisation on every publish, three readiness defects finally closed by deleting the shadow flag. Two suppressed findings merged UNFIXED under the stated criterion (neither loses nor corrupts an event) and go to U9: the changelog entry under-describes when NOT_DELIVERABLE is now reported, and the decodable park rebuilds properties from the CloudEvent so original AMQP metadata outside the mapping is not carried (checked: only the UNDECODABLE path promises unchanged properties and it keeps that, so no documented contract is broken). PRIOR round 13 routing, LAST. Five runs green at 8dd8b0273. CORRECTION: the orchestrator wrongly called that thread a FALSE POSITIVE. It was REAL at the reviewed head 8dd8b0273, where acceptCloudEvent read readiness AFTER the accept (verified afterwards with git show). The error was reading the worker WORKING TREE, which already carried an uncommitted fix, while trusting git log -1 to identify the content. No harm followed only because the worker had independently found the same race and fixed it in a728f31af, so the thread it actually declined was the duplicate describing an already-fixed race. Lesson recorded. Original (wrong) reasoning follows: it claims the readiness check happens AFTER buffering so a merely buffered event can report DELIVERED, but DomainEventFeed.acceptCloudEvent reads readiness at line 298 BEFORE acceptReportingDelivery at 299 and returns DELIVERED only when both hold, so a false read yields NOT_DELIVERABLE (conservative) and a true read means live was already set so the accept folds synchronously; the only dangerous ordering needs live to go true then false, and live is assigned exactly once at BlockingHandover.java:356 and never cleared. Worth keeping as a case where a plausible reviewer blocker would have caused a fix to a non-bug had it been relayed unchecked. THREE real items routed: a performance defect where CloudEventData.toBytes() is called twice per publish and Occurrent's lazy PojoCloudEventData therefore serialises every domain event twice; both bridge builders' javadoc claiming a parking destination under REDELIVER is refused when it is accepted and ignored (ADR 133 requires the CONVERSE refusal, PARK without a destination, which IS implemented), to be resolved either way but identically on both bridges; and the stale four-versus-five failure-source count the verifier also flagged. The suppressed finding about .context/ORCHESTRATOR.md being stale is the orchestrator's own file and is handled at merge. PRIOR round 12 routing, bounded to documentation. Verifier returned no blockers on the delegation and validated the architectural call by independent tracing: the deleted buffer was never what guaranteed ordering, RabbitMQ per-queue FIFO was, and the buffer only decided WHERE an in-flight message waited, so a message published during a replay now waits on the durable queue and is folded before any ack. It also derived that adding stopped to the predicate would be a BUG (stopped is consulted only when live is false, and the one state where both hold is an unsupported second catch-up on a live handover that still delivers), and confirmed no deadlock, no torn read, no other caller on the deleted signal, and all three rewritten tests correct and non-vacuous, the NOT_DELIVERABLE case costing an extra round trip not a loss since the dedup cache prevents a refold. TWO fixes routed: the RabbitMqDomainEventBridge class javadoc was untouched this round and now UNDERSTATES its own gate, saying the transition has 'started' where the gate is reaching LIVE and framing it as applying only before catchUpAll/catchUp/goLive where it now holds throughout an ACTIVE replay, which leaves the worst possible stale prose right on the class whose behaviour changed; and with it, document the operational consequence that the bridge consumes NOTHING for the whole replay (minutes on a large store), harmless on the durable unbounded queue the builder declares but a real loss path for an operator whose queue carries x-max-length or x-message-ttl with drop-oldest. Plus a direct BlockingHandoverTest case for the new public accessor covering not-yet-live, live and poisoned. After this the PR goes to the merge gate on whatever is pushed. PRIOR round 11, head 8ae1ef7c3. Delegation implemented as ruled: BlockingHandover.isReadyForLiveDelivery() computed under its own lock as live && catchUpFailure == null, CatchupProjectionFeed's shadow flag DELETED with every set site. Round 9 and 10 tests pass unchanged; THREE round 6-8 tests broke and were rewritten to coarser but reportedly still-safe behaviour, which the worker reported rather than quietly adjusting as instructed. Mutation-tested by reverting the accessor to return live and confirming the round-9 poisoning test catches it. RoutingOutcomeChannel's javadoc example now names a real overload, compile-checked. RabbitMqConfirmPublisher moved its return-matching token off the AMQP correlationId into its own header so a caller-supplied id survives the parking path's republish-unchanged promise, and the worker self-caught a follow-on where that header read back off a real basic.return arrives as LongString so an instanceof String check silently never matched, the SAME gotcha already documented in the mapper, caught by a pre-existing integration test. Prose gate run as a separate step from the push per the round-10 lesson. FINAL VERIFY dispatched (0f70c67ae..8ae1ef7c3) attacking the semantic change rather than the report: what the three rewritten tests asserted before versus now, whether the bridge now stops consuming DURING a replay (live is false throughout, where the old flag was deliberately true) and if so whether events published during a replay still arrive afterwards from the queue in order with no gap between replayed history and live tail, which is the property the buffer existed to provide, whether stopped belongs in the predicate, and whether the accessor can deadlock or observe torn state. PRIOR round 11 routing with the DESIGN ruling, since this is the THIRD readiness defect in three rounds (round 1 gated on hasProjection alone, round 9 failed to clear on failure, now a later catchUp or goLive can set the flag true again while BlockingHandover keeps a terminal catchUpFailure the verifier already proved is never cleared, so the bridge resumes into a poisoned handover and hot-loops). The fault is not any of the three bugs but that readyForLiveDelivery is a SHADOW COPY of state BlockingHandover already owns (private live, stopped and catchUpFailure at lines 131-133, no accessor), and each round finds a new way the copy diverges. Ruling: add a read-only accessor on BlockingHandover computed under the same lock, delegate isReadyForLiveDelivery to it, and DELETE the flag and every set site; the class is in an internal package so an additive accessor is low risk and introduces no behaviour of its own. Round 9 and 10 tests must still pass against the delegation, and any that does not is a further disagreement worth reporting rather than adjusting. Two more real findings: RoutingOutcomeChannel's public javadoc example calls a builder overload that does not exist so the documented wiring cannot compile, which matters because ADR 133 decision 1 makes that wiring order part of the decision; and RabbitMqConfirmPublisher line 132 overwrites a caller-supplied AMQP correlationId, breaking the undecodable parking path's explicit promise to park the original properties unchanged. Round 10 outcome for the record: audit found 16 vacuous assertions not 5, all fixed and proven by deleting the single basicAck call site, auto-delete queues fixed as an exposed consequence, present-but-empty data preserved via a marker header with an ADR amendment. PRIOR round 10, head 0f70c67ae. The audit found FAR more than Copilot flagged: not 5 vacuous assertions but SIXTEEN, eight per bridge test class, spanning DELIVERED, FILTERED and PARK ack-after-confirm, so the unit's central guarantee had essentially no valid test behind it. All 16 fixed via an assertAcknowledged helper checked only after the bridge closes, since closing requeues anything unacked. The pre-existing UnreadableLiveFilterException test already used the correct close-then-check shape and served as the template, which retroactively validates that earlier requirement. The fix also EXPOSED a real bug: the CloudEvent bridge test's queues were auto-delete, so closing the bridge destroyed the queue before the check could run. Decisive mutation test: deleting the single production basicAck call site failed all 16 fixed tests while the 2 non-ack tests stayed green. Production defect also closed, present-but-empty data no longer conflated with absent data, preserved via a marker header whose underscore cannot collide with a real attribute name, ADR 133 amendment recorded, both halves mutation-tested. WORKER SELF-REPORTED a process lapse rather than hiding it: it ran its prose gate and the push in one batch so the gate did not gate, and a semicolon reached a commit message; it did not force-push to fix it without authorisation. MERGE-TIME ACTION REQUIRED: supply an explicit subject and --body-file at the squash, because a squash body here is composed from branch commit messages (verified on main at fa367096b), so the defective message would otherwise land on main, and ten rounds of commit messages would make a poor history anyway. PRIOR round 10 routing, OVERRIDING my own declared last-content-round stop, and the reason satisfies the exception I stated (anything that loses or corrupts an event). Final narrow verify returned MERGE-SAFE on the readiness generalisation with direct evidence: BlockingHandover sets catchUpFailure UNCONDITIONALLY at line 304, outside the replayOpen guard, and never clears it anywhere in the class, so every exceptional exit was ALREADY terminal before this delta and the generalisation strands nothing, it only makes readiness catch up to a poison the handover already enforced. That work is settled. But Copilot then found that FIVE bridge tests share one false premise: RabbitMQ ready-message count EXCLUDES deliveries outstanding on a consumer, so it hits zero on receipt and every queue-is-empty-therefore-acknowledged assertion passes with basicAck never called. That leaves the DELIVERED ack, the FILTERED ack and the PARK ack-after-confirm with NO valid test, which is not mergeable however green the suite looks. Routed: fix all five by closing the bridge first so an unacknowledged delivery requeues, AUDIT every ack-related assertion in both bridge classes including the earlier not-acknowledged ones (opposite-direction assertions are unaffected), report the audit not just the fixes, and mutation-test by deleting each basicAck. Plus one production defect: the mapper rebuilds present-but-zero-length data as data == null, conflating it with no-data since both encode as an empty AMQP body, with the fix-or-document call left to the worker under the cross-transport symmetry rule. PRIOR round 9, head 190225085. Fixed at the INVARIANT as instructed rather than as a third special case: catchUp() now wraps the whole handover.catchUp call in one try/catch clearing readiness on any exceptional exit, plus the existing clear on a false return, one mechanism for every failure source, which also closes the verifier's sharper replayStarted() case where replayOpen is never set so replayAbandoned never fires. Test asserts the invariant against five distinct failure sources, with the general catch and the false-return branch mutation-tested independently. close() javadoc now states precisely that it waits out the current backoff and the attempt after it. Both declines executed with recorded reasoning a